upstream auth-service {
    server auth_service:8001;
}

upstream event-service {
    server event_service:8002;
}

upstream user-service {
    server user_service:8003;
}

upstream task-service {
    server task_service:8004;
}

upstream resource-service {
    server resource_service:8005;
}

upstream notification-service {
    server notification_service:8006;
}

upstream ai-assistant{
    server ai_assistant:8007;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        return 200 "API Gateway OK\n";
        add_header Content-Type text/plain;
    }

    location /api/auth/ {
        proxy_pass http://auth-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
#         proxy_redirect off;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/events/ {
        proxy_pass http://event-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/users/ {
        proxy_pass http://user-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/tasks/ {
        proxy_pass http://task-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/resources/ {
        proxy_pass http://resource-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/notifications/ {
        proxy_pass http://notification-service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location /api/ai/ {
        proxy_pass http://ai-assistant;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
