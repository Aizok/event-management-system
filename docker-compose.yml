services:
  postgres_auth:
    image: postgres:15-alpine
    container_name: postgres_auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres_events:
    image: postgres:15-alpine
    container_name: postgres_events
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=ru_RU.UTF-8 --lc-ctype=ru_RU.UTF-8
    ports:
      - "5434:5432"
    volumes:
      - postgres_events_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_user -d events_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres_users:
    image: postgres:15-alpine
    container_name: postgres_users
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=ru_RU.UTF-8 --lc-ctype=ru_RU.UTF-8
    ports:
      - "5435:5432"
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user_user -d users_db" ]
    networks:
      - app-network

  postgres_tasks:
    image: postgres:15-alpine
    container_name: postgres_tasks
    environment:
      POSTGRES_DB: tasks_db
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=ru_RU.UTF-8 --lc-ctype=ru_RU.UTF-8
    ports:
      - "5436:5432"
    volumes:
      - postgres_tasks_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U task_user -d tasks_db" ]
    networks:
      - app-network

  postgres_resources:
    image: postgres:15-alpine
    container_name: postgres_resource
    environment:
      POSTGRES_DB: resources_db
      POSTGRES_USER: resource_user
      POSTGRES_PASSWORD: resource_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=ru_RU.UTF-8 --lc-ctype=ru_RU.UTF-8
    ports:
      - "5437:5432"
    volumes:
      - postgres_resources_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U resource_user -d resources_db" ]
    networks:
      - app-network

  postgres_notifications:
    image: postgres:15-alpine
    container_name: postgres_notifications
    environment:
      POSTGRES_DB: notif_db
      POSTGRES_USER: notif_user
      POSTGRES_PASSWORD: notif_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=ru_RU.UTF-8 --lc-ctype=ru_RU.UTF-8
    ports:
      - "5438:5432"
    volumes:
      - postgres_notifications_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U notif_user -d notif_db" ]
    networks:
      - app-network

  redis_cache:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - app-network

  auth-service:
    build: ./auth-service
    container_name: auth_service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://auth_user:auth_password@postgres_auth:5432/auth_db
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres_auth:
        condition: service_healthy
    volumes:
      - ./auth-service:/app
      - /app/__pycache__
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    networks:
      - app-network

  event-service:
    build: ./event-service
    container_name: event_service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://event_user:event_password@postgres_events:5432/events_db
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres_events:
        condition: service_healthy
    volumes:
      - ./event-service:/app
      - /app/__pycache__
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user_service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://user_user:user_password@postgres_users:5432/users_db
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres_users:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8003/health" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  task-service:
    build:
      context: .
      dockerfile: task-service/Dockerfile
    container_name: task_service
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql://task_user:task_password@postgres_tasks:5432/tasks_db
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres_tasks:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  resource-service:
    build: ./resource-service
    container_name: resource_service
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql://resource_user:resource_password@postgres_resources:5432/resources_db
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres_resources:
        condition: service_healthy
    volumes:
      - ./resource-service:/app
      - /app/__pycache__
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification_service
    ports:
      - "8006:8006"
    environment:
      - DATABASE_URL=postgresql://notif_user:notif_password@postgres_notifications:5432/notif_db
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      postgres_notifications:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8006/health" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/gateway.conf:/etc/nginx/conf.d/gateway.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth-service
      - user-service
      - event-service
      - task-service
      - resource-service
      - notification-service
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_auth_data:
  postgres_events_data:
  postgres_users_data:
  postgres_tasks_data:
  postgres_resources_data:
  postgres_notifications_data:
  redis_data:
  rabbitmq_data:


networks:
  app-network:
    driver: bridge
