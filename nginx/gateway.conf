upstream auth-service {
    server auth_service:8001;
}

upstream user-service {
    server user_service:8003;
}

upstream event-service {
    server event_service:8002;
}

server {
    listen 80;
    server_name localhost;

    location /health {
        return 200 "API Gateway OK\n";
        add_header Content-Type text/plain;
    }

    location /api/auth/ {
        proxy_pass http://auth-service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/users/ {
        proxy_pass http://user-service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/events/ {
        proxy_pass http://event-service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404 "API endpoints:\n/health\n/api/auth/\n/api/users/\n/api/events/\n";
    }
}
