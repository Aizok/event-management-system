services:
  # ========================================
  # БАЗЫ ДАННЫХ
  # ========================================
  postgres_auth:
    image: postgres:15-alpine
    container_name: postgres_auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  postgres_events:
    image: postgres:15-alpine
    container_name: postgres_events
    environment:
      POSTGRES_DB: events_db
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_events_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_user -d events_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis_cache:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - app-network

  auth-service:
    build: ./auth-service
    container_name: auth_service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://auth_user:auth_password@postgres_auth:5432/auth_db
    depends_on:
      postgres_auth:
        condition: service_healthy
    volumes:
      - ./auth-service:/app
      - /app/__pycache__
    restart: unless-stopped
    networks:
      - app-network

  event-service:
    build: ./event-service
    container_name: event_service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://event_user:event_password@postgres_events:5432/events_db
      - SECRET_KEY=${SECRET_KEY}  # Берется из .env
    depends_on:
      postgres_events:
        condition: service_healthy
    volumes:
      - ./event-service:/app
      - /app/__pycache__
    restart: unless-stopped
    networks:
      - app-network


volumes:
  postgres_auth_data:
  postgres_events_data:
  redis_data:
  rabbitmq_data:

networks:
  app-network:
    driver: bridge
